[theme]
base = "dark"
primaryColor = "#0ea5e9"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "sans serif"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
# Hide developer options (Deploy button etc.) from customers
toolbarMode = "minimal"
